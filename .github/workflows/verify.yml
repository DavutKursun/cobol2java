name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install GnuCOBOL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnucobol
      - name: Demo app uses the same prompt format as training
        run: diff scripts/prompts.py space/prompts.py
      - name: Every COBOL/Java pair produces identical output
        run: python scripts/verify.py data/programs --verbose
